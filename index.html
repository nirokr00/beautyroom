<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Rutina</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Rutina">
<meta name="theme-color" content="#F6F1E7">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --beige:#F6F1E7; --white:#FFFFFF; --mint:#CFE6DA; --mint-d:#6FA58C; --mint-ink:#2F5A47;
  --sand:#EBE2D0; --ink:#2B2F2C; --mute:#7C8580; --rest:#F3E3D6;
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--beige);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.app{max-width:480px;margin:0 auto;padding:18px 20px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px}
.pick{position:relative}
.pick button,.btn{font:500 14px var(--sans);border:0;border-radius:999px;background:var(--white);color:var(--mint-ink);padding:10px 16px;box-shadow:0 1px 0 var(--sand)}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
h1{font:400 26px/1.1 var(--serif);margin:14px 0 2px;letter-spacing:-.02em;text-transform:capitalize}
.sub{font:400 14px var(--serif);color:var(--mute);margin:0 0 12px}
.nav{display:flex;gap:8px;margin-bottom:18px}
.nav .btn{flex:1;text-align:center}
.chip{display:inline-block;background:var(--mint);color:var(--mint-ink);font-weight:600;font-size:13px;padding:7px 13px;border-radius:999px;margin-bottom:14px}
.chip.rest{background:var(--rest);color:#8A5A3C}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sand);border-radius:16px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:transparent;font:500 15px var(--sans);color:var(--mute);padding:12px 0;border-radius:12px}
.tabs button.on{background:var(--white);color:var(--ink);box-shadow:0 2px 8px rgba(60,70,60,.08)}
.card{display:flex;gap:14px;align-items:center;background:var(--white);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(60,70,60,.05);transition:opacity .2s}
.card.rest{background:var(--rest)}
.ph{flex:none;width:68px;height:68px;border-radius:18px;background:var(--mint);display:grid;place-items:center;font-size:30px;position:relative;cursor:pointer}
.ph .img{position:absolute;inset:0;border-radius:18px;background-size:cover;background-position:center}
.ph .add{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--white);color:var(--mint-ink);font:600 14px/22px var(--sans);text-align:center;box-shadow:0 1px 4px rgba(60,70,60,.25)}
.ph .add.x{color:#A5694A}
.hint{text-align:center;font-size:12.5px;color:var(--mute);margin:14px 0 0}
.card.rest .ph{cursor:default}
.card.rest .ph{background:#F8D9C4}
.n{z-index:2;position:absolute;top:-6px;left:-6px;background:var(--mint-ink);color:#fff;width:22px;height:22px;border-radius:50%;font:600 12px/22px var(--sans);text-align:center}
.card.rest .n{background:#A5694A}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.tx span{display:block;font-size:13.5px;color:var(--mute);margin-top:3px;line-height:1.35}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mint);display:grid;place-items:center;color:transparent;font-size:14px}
.card.done{opacity:.5}
.card.done .chk{background:var(--mint-d);border-color:var(--mint-d);color:#fff}
.card.done b{text-decoration:line-through}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font:400 17px/1.4 var(--serif)}
.secs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 0;padding-bottom:2px}
.secs button{flex:none;border:0;border-radius:999px;background:var(--white);color:var(--mute);font:500 14px var(--sans);padding:9px 15px}
.secs button.on{background:var(--mint-ink);color:#fff}
.wide{width:100%;margin-top:6px;text-align:center}.pri{background:var(--mint-ink);color:#fff}
.ed{flex:none;border:0;background:transparent;font-size:18px;color:var(--mute);padding:6px}
.bar{height:6px;border-radius:6px;background:var(--sand);margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint-d)}
.warn{color:#B0583A}.gh{font:500 15px var(--serif);color:var(--mute);margin:18px 0 8px}
.mini{padding:7px 12px;font-size:13px;margin-top:8px}
dialog{border:0;border-radius:24px;padding:20px;width:min(92vw,420px);background:var(--beige);color:var(--ink);font-family:var(--sans)}
dialog::backdrop{background:rgba(40,50,45,.4)}dialog h2{font:400 24px var(--serif);margin:0 0 12px}
.fld{display:block;margin-bottom:12px;font-size:13px;color:var(--mute)}
.fld input,.fld select{display:block;width:100%;margin-top:4px;font:16px var(--sans);padding:11px;border:1px solid var(--sand);border-radius:12px;background:#fff;color:var(--ink)}
.dch{display:flex;gap:6px;margin-top:6px}.dc input{display:none}
.dc span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--mute);font-weight:600}
.dc input:checked+span{background:var(--mint-d);color:#fff}
.row{display:flex;gap:8px;margin-top:16px}.row .btn{flex:1}.app{padding-bottom:110px}
.secs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:0;padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);background:rgba(246,241,231,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--sand);overflow:visible}
.secs button{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;color:var(--mute);border-radius:14px;padding:6px 0;font-size:11px}
.secs button span{font-size:22px;opacity:.65;filter:grayscale(.5)}
.secs button.on{background:var(--mint);color:var(--mint-ink)}.secs button.on span{opacity:1;filter:none}
.card.off{opacity:.45}.card.use .chk{background:var(--mint-d);border-color:var(--mint-d);color:#fff}
span.chip{margin:0 4px 6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--white);border-radius:22px;padding:12px;text-align:center;font-size:13px}
.cal i{color:var(--mute);font-style:normal;font-size:12px;padding:4px 0}
.cm{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;text-transform:capitalize}
.cd{border:0;background:transparent;border-radius:50%;aspect-ratio:1;font:500 13px var(--sans);color:var(--ink);position:relative}
.cd.u{background:var(--mint)}.cd.z{background:var(--sand);color:var(--mute)}.cd.s{outline:2px solid var(--mint-ink)}
.cd u{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#C9805C}
.subs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sand);border-radius:16px;padding:4px;margin:4px 0 16px}
.subs button{border:0;background:transparent;font:500 14px var(--sans);color:var(--mute);padding:10px 0;border-radius:12px}
.subs button.on{background:var(--white);color:var(--ink);box-shadow:0 2px 8px rgba(60,70,60,.08)}
.cd.p{background:linear-gradient(135deg,var(--mint) 50%,var(--sand) 50%)}.cd.f{border:1px dashed var(--mint-d)}
.rv{display:block;font-size:13px;color:var(--ink);margin-top:5px}
.or{color:#C9772E;font-weight:600}.warn{font-weight:600}
.rl{background:#fff;border-radius:20px;padding:4px 14px;margin-bottom:10px}
.rw{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--beige)}.rw:last-child{border:0}
.rw .ph{width:46px;height:46px;border-radius:14px;font-size:22px}.rw .ph.rest{background:#F8D9C4;display:grid;place-items:center;position:relative}
.rt{flex:1;min-width:0;font-size:13px;color:var(--mute);line-height:1.3}.rt b{display:block;color:var(--ink);font-size:14px}
.gl{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--mint-d);margin:10px 0 0}
.ck{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px;color:var(--ink)}.ck input{width:20px;height:20px;accent-color:var(--mint-d)}
.dd{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px}.dd summary{font:500 14px var(--sans)}
.car{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px}.car .ph{width:56px;height:56px;flex:none}
.car small{display:block;font-size:10px;max-width:58px;text-align:center;color:var(--mute);margin-top:4px;overflow-wrap:anywhere}
.sq{display:block;width:100%;font:16px var(--sans);padding:11px 14px;margin:0 0 12px;border:1px solid var(--sand);border-radius:14px;background:#fff;color:var(--ink)}
.rc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;overflow:visible;padding:12px 6px 6px}
.rc .rcell .ph{width:98px;height:98px;border-radius:25px;font-size:40px;margin:0 auto}.rc small{font-size:11px;max-width:none;color:var(--ink);margin-top:6px}.rcell{flex:none;text-align:center}.rcell .ph.rest{background:#F8D9C4;display:grid;place-items:center;position:relative;font-size:26px}.rcell .ed{padding:2px 8px;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span id="rel"></span>
    <div class="pick"><button>📅 Ver otra fecha</button><input type="date" id="date"></div>
  </div>
  <div class="secs" id="secs"><button data-s="face"><span>🧖</span>Rostro</button><button data-s="body"><span>🧴</span>Cuerpo</button><button data-s="hair"><span>💆</span>Cabello</button><button data-s="mk"><span>💄</span>Maquillaje</button><button data-s="inv"><span>📦</span>Todo</button></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="nav">
    <button class="btn" id="prev">‹ Día anterior</button>
    <button class="btn" id="today">Hoy</button>
    <button class="btn" id="next">Día siguiente ›</button>
  </div>
  <div class="subs" id="subs"><button data-u="r">Rutina</button><button data-u="i">Inventario</button><button data-u="c">Calendario</button></div>
  <div id="chips"></div>
  <div class="tabs">
    <button id="tAm">☀️ Rutina de Mañana</button>
    <button id="tPm">🌙 Rutina de Noche</button>
  </div>
  <div id="list"></div>
  <p class="hint">Toca el recuadro de un producto para subir su foto 📷</p>
  <input type="file" id="file" accept="image/*" hidden><input type="file" id="imp" accept=".json,application/json" hidden><dialog id="dlg"></dialog>
</div>

<script>
// ---------- Datos ----------
const P = {
  agua:   {e:'💧',n:'Enjuagar con agua',t:'Solo agua tibia, sin frotar'},
  illum:  {e:'✨',n:'Nø Cosmetics Liquid Illuminator',t:'Unas gotas, presionar suave'},
  bubble: {e:'🫧',n:'Contorno Bubble',t:'Toquecitos con el anular'},
  boj:    {e:'🌾',n:'Contorno Beauty of Joseon',t:'Toquecitos con el anular'},
  oil:    {e:'🧴',n:'Cetaphil Oil Free',t:'Capa fina por rostro y cuello'},
  oilL:   {e:'🧴',n:'Cetaphil Oil Free',t:'Capa ligera'},
  lrp:    {e:'☀️',n:'Protector LRP Fluido',t:'Cantidad generosa, dos dedos'},
  eucerin:{e:'🛡️',n:'Protector Eucerin Oil Control',t:'Cantidad generosa, dos dedos'},
  mic:    {e:'🫧',n:'Agua micelar Garnier',t:'Con disco de algodón, sin frotar'},
  finacea:{e:'🌿',n:'Finacea Gel',t:'Capa fina en el rostro'},
  finaceaW:{e:'🌿',n:'Finacea Gel',t:'Capa fina · esperar 3 minutos'},
  adap:   {e:'💊',n:'Adapaleno 0.1%',t:'Cantidad de un guisante, evitar ojos'},
  cream:  {e:'🤍',n:'Crema Cetaphil Hydrating',t:'Capa generosa para sellar'},
  pre:    {e:'🍃',n:'Prequel Gleanser',t:'Masajear y enjuagar'},
  haru:   {e:'🫒',n:'Aceite Haruharu (ojos)',t:'Retirar maquillaje de ojos'},
  vich:   {e:'🧼',n:'Vichy Normaderm',t:'Limpiar y enjuagar'},
  vichM:  {e:'🧼',n:'Vichy Normaderm',t:'Limpiar y enjuagar (Effaclar si se acaba)'},
  espuma: {e:'☁️',n:'Espuma micelar Garnier',t:'Limpieza suave'},
  noble:  {e:'🫧',n:'Limpiador noble (Vanicream/Beplain)',t:'Segundo paso de limpieza'},
  hydr:   {e:'💦',n:'Nø Cosmetics Liquid Hydrator',t:'Esperar 5 minutos antes de seguir'},
  hydrN:  {e:'💦',n:'Nø Cosmetics Liquid Hydrator',t:'Esperar 5 minutos'},
};
const ALIAS={oilL:'oil',finaceaW:'finacea',vichM:'vich',hydrN:'hydr'};
Object.entries(P).forEach(([k,v])=>v.k=ALIAS[k]||k);
const G={agua:'Limpieza',mic:'Limpieza',vich:'Limpieza',pre:'Limpieza',haru:'Limpieza',espuma:'Limpieza',noble:'Limpieza',illum:'Serums',bubble:'Serums',boj:'Serums',hydr:'Serums',finacea:'Medicamentos',adap:'Medicamentos',cream:'Humectación',oil:'Humectación',lrp:'Humectación',eucerin:'Humectación'};
Object.values(P).forEach(v=>v.g=G[v.k]);
let photos={}; try{photos=JSON.parse(localStorage.getItem('skin-photos')||'{}')}catch(e){}
const savePhotos=()=>{try{localStorage.setItem('skin-photos',JSON.stringify(photos))}catch(e){alert('No hay espacio para más fotos.')}};
const REST = {e:'🌙',n:'DESCANSO TOTAL',t:'Sin Adapaleno esta noche: pasa directo a la crema'};

// ---------- Lógica ----------
const D = (y,m,d)=>new Date(y,m-1,d,12).getTime();
const START=D(2026,10,18), F1_END=D(2026,11,8), WED1=D(2026,11,9), WED2=D(2026,11,10),
      F2=D(2026,11,11), F3=D(2026,12,9);
const REST_DAYS = new Set(['2026-11-13','2026-11-16','2026-11-21','2026-11-25','2026-11-29']);
const key = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const noon = d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);

function routine(date){
  const t = noon(date).getTime();
  const L = a=>a.map(k=>typeof k==='string'?P[k]:k);
  if(t<START) return {phase:null};
  if(t<=F1_END){
    const par = Math.round((t-START)/864e5)%2===0;
    return {phase:'Fase 1 · Preparación',
      am:L(['agua','illum','bubble','oil','lrp']),
      pm: par ? L(['mic','vich','finacea','bubble','cream'])
              : L(['mic','vich','adap','boj','cream']),
      pmTag: par?'Noche de Finacea':'Noche de Adapaleno'};
  }
  if(t===WED1) return {phase:'Boda · Víspera',
    am:L(['agua','illum','bubble','oil','lrp']), amTag:'Rutina de Fase 1',
    pm:L(['mic','pre','cream']), pmTag:'Cero activos'};
  if(t===WED2) return {phase:'Boda · Día del evento',
    am:L(['pre','bubble','oilL']), amTag:'Mañana de la boda',
    pm:L(['haru','mic','vich','cream']), pmTag:'Noche de la boda'};
  if(t<F3){
    const k=key(date), rest=REST_DAYS.has(k);
    const pm=[P.espuma,P.noble,P.hydr];
    if(rest) pm.push(REST);
    else pm.push(P.adap);
    pm.push(P.cream);
    return {phase:'Fase 2 · Transición',
      am:L(['vich','finaceaW','illum','bubble','oil','eucerin']),
      pm, pmTag: rest?'Descanso total':'Noche de Adapaleno', rest};
  }
  const dow=date.getDay(), mwf=[1,3,5].includes(dow);
  return {phase:'Fase 3 · Ataque diario',
    am:L(['vichM','finaceaW','illum','bubble','oil','eucerin']),
    pm:[P.espuma,P.noble,P.hydr,P.adap,mwf?P.boj:P.bubble,P.cream],
    pmTag:'Adapaleno diario'};
}

// ---------- UI ----------
const $=id=>document.getElementById(id);
const fmt=new Intl.DateTimeFormat('es',{weekday:'long',day:'numeric',month:'long'});
const fmtY=new Intl.DateTimeFormat('es',{year:'numeric'});
let cur=noon(new Date()), tab = new Date().getHours()>=17||new Date().getHours()<4 ? 'pm':'am';
let done={}; try{done=JSON.parse(localStorage.getItem('skin-done')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('skin-done',JSON.stringify(done))}catch(e){}};

const row=(id,n,t,ed)=>{const x=inv(id)||{name:'?'};return `<div class="rcell">${ph('i_'+id,'🧴',n,ed)}<small>${esc(x.name)}</small>${t?`<small>${esc(t)}</small>`:''}</div>`};
function renderFace(){
  const r=routine(cur), today=noon(new Date());
  const diff=Math.round((cur-today)/864e5);
  $('title').textContent=fmt.format(cur);
  $('sub').textContent=fmtY.format(cur);
  $('rel').textContent = diff===0?'Hoy':diff===1?'Mañana':diff===-1?'Ayer':diff>0?`En ${diff} días`:`Hace ${-diff} días`;
  $('date').value=key(cur);
  $('tAm').classList.toggle('on',tab==='am');
  $('tPm').classList.toggle('on',tab==='pm');
  $('chips').innerHTML=''; $('list').innerHTML=rutHTML('face',tab);
}
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ALL=[0,1,2,3,4,5,6], DAYS=['D','L','M','X','J','V','S'], DAYN=['dom','lun','mar','mié','jue','vie','sáb'];
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const dbt=(a,b)=>Math.round((noon(b)-noon(a))/864e5);
const fd=s=>pd(s).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'});
let data=ld('skin-data',null)||{
 hair:[{id:'h1',name:'Shampoo Pantene Sheer Volume',e:'🧴',when:'Ducha',days:ALL},{id:'h2',name:"Acondicionador Ever Pure (L'Oréal)",e:'💆',when:'Ducha',days:[]}],
 body:[{id:'b1',name:'Naturium Glow Getter',e:'✨',when:'Ducha',days:[]},{id:'b2',name:'Naturium Salicylic Acid Body Wash',e:'🚿',when:'Ducha',days:[]},{id:'b3',name:'Barra Dove',e:'🧼',when:'Ducha',days:[]},{id:'b4',name:'Revive Eye Serum Beauty of Joseon',note:'En brazos · queratosis pilaris',e:'💪',when:'Noche',days:[]}],
 inv:[]};
const inv=id=>data.inv.find(x=>x.id===id), nm=p=>(inv(p.id)||{}).name||'';
const faceId=k=>(data.slot||{})[k]||'f_'+k;
const faceIdAt=(k,d)=>{const h=((data.hist||{})[k]||[]).find(e=>d<=e.until);return h?h.id:faceId(k)};
const mkItem=(name,cat)=>({id:'n'+Date.now()+Math.random().toString(36).slice(2,5),name,cat,status:'En uso',opened:key(new Date()),expiry:'',finished:'',total:0,reg:'Completo'});
const ensure=(name,cat)=>{let it=data.inv.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!it){it=mkItem(name,cat);data.inv.push(it)}return it.id};
function mig(){
  const T=key(new Date()), add=(id,name,cat)=>{if(!inv(id))data.inv.push({id,name,cat,status:'En uso',opened:T,expiry:'',finished:'',total:0,reg:'Parcial'})};
  new Set(Object.values(P).map(v=>v.k)).forEach(k=>add('f_'+k,P[k].n,'Rostro'));
  [['body','Cuerpo'],['hair','Cabello']].forEach(([s,c])=>data[s].forEach(x=>{if(x.name){add(x.id,x.name,c);delete x.name}}));
  data.mk.base.forEach(x=>{if(x.name){add(x.id,x.name,'Maquillaje');delete x.name}});
  Object.values(data.mk.log).forEach(L=>L.extra=(L.extra||[]).map(e=>inv(e)?e:ensure(e,'Maquillaje')));
  data.inv.forEach(x=>{if(!x.reg)x.reg='Parcial'});
  if(!data.ev){
    const E=(sc,t,k,o,from,to,fr,skip)=>({id:'e_'+sc+t+k+from,sc,t,inv:'f_'+k,o,from,to:to||'',freq:fr||{t:'d'},skip:skip||[]});
    const ev2=a=>({t:'e',n:2,a}), R=['2026-11-13','2026-11-16','2026-11-21','2026-11-25','2026-11-29'];

     +`<div class="fld" style="margin-top:12px">Adicionales (no previstos)</div>`+ex.map((e,i)=>`<span class="chip" data-x="${i}">${esc((inv(e)||{}).name)} ×</span>`).join('')
     +`<div class="fld"><input id="xq" type="search" class="sq" placeholder="🔍 Buscar para agregar adicional…" style="margin:0"></div><div id="xr"></div><div class="row"><button value="x" class="btn">Cancelar</button><button value="ok" class="btn pri">Guardar</button></div></form>`;
    d.querySelectorAll('input[data-i]').forEach(c=>c.onchange=()=>{list[c.dataset.i].on=c.checked});
    d.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ex.splice(+c.dataset.x,1);draw()});
    const xq=d.querySelector('#xq'),xr=d.querySelector('#xr');
    xq.oninput=()=>{const q=norm(xq.value.trim());if(!q){xr.innerHTML='';return}
      const m=data.inv.filter(x=>x.status!=='Terminado'&&norm(x.name).includes(q)).slice(0,6);
      xr.innerHTML=m.map(x=>`<div class="ck" data-id="${x.id}">＋ ${esc(x.name)}</div>`).join('')+`<div class="ck" data-new="1">✚ Crear «${esc(xq.value.trim())}»</div>`;
      xr.querySelectorAll('.ck').forEach(r=>r.onclick=()=>{ex.push(r.dataset.new?ensure(xq.value.trim(),cat):r.dataset.id);draw()})};
    d.querySelector('form').onsubmit=e=>{if(e.submitter.value==='ok')onSave(list,ex)};
  };
  draw(); d.showModal();
}
function scope(cb){const d=$('dlg');d.innerHTML='<h2>¿A qué días aplica?</h2>'+[['day','Solo este día'],['fut','Este día y los siguientes'],['all','Todos los días del evento']].map(([v,l])=>`<button type="button" class="btn wide" data-v="${v}">${l}</button>`).join('')+'<button type="button" class="btn wide" data-v="">Cancelar</button>';
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>{d.close();if(b.dataset.v)cb(b.dataset.v)});d.showModal()}
function editEv(e,pre){
  const sc=e?e.sc:pre.sc, k=key(cur), f=e?e.freq||{t:'d'}:{t:'d'}, nameOf=id=>(inv(id)||{}).name;
  const prods=data.inv.filter(x=>x.cat===CAT[sc]&&(x.status!=='Terminado'||(e&&x.id===e.inv)));
  const v=e?{prod:nameOf(e.inv),t:e.t==='am'?'Mañana':'Noche',o:e.o,from:e.from,to:e.to,fq:{d:'Todos los días',e:'Cada N días',w:'Días de la semana'}[f.t],n:f.n||2,days:f.days||[]}
    :{prod:pre.inv?nameOf(pre.inv):(prods[0]||{}).name,t:pre.t==='pm'?'Noche':'Mañana',o:items(k,sc,sc==='face'?(pre.t==='pm'?'pm':'am'):'x').length+1,from:k,to:'',fq:'Todos los días',n:2,days:[]};
  const fields=[{k:'prod',l:'Producto',t:'select',o:prods.map(x=>x.name)},...(sc==='face'?[{k:'t',l:'Momento',t:'select',o:['Mañana','Noche']}]:[]),{k:'o',l:'Orden dentro de la rutina (1 = primero)',t:'number'},{k:'from',l:'Desde',t:'date'},{k:'to',l:'Hasta (vacío = sin fin)',t:'date'},{k:'fq',l:'Frecuencia',t:'select',o:['Todos los días','Cada N días','Días de la semana']},{k:'n',l:'Si es cada N días: N',t:'number'},{k:'days',l:'Si es por días de la semana',t:'days'}];
  form(e?'Editar en la rutina':'Agregar a la rutina',fields,v,o=>{
    const pr=prods.find(x=>x.name===o.prod);if(!pr)return;
    const from=o.from||k, nv={sc,t:sc==='face'?(o.t==='Noche'?'pm':'am'):'x',inv:pr.id,o:o.o||99,from,to:o.to||'',freq:o.fq==='Todos los días'?{t:'d'}:o.fq==='Cada N días'?{t:'e',n:o.n||2,a:from}:{t:'w',days:o.days}};
    if(pr.status!=='En uso'){pr.status='En uso';pr.opened=pr.opened||key(new Date())}
    if(!e){data.ev.push(Object.assign({id:'e'+Date.now(),skip:[]},nv));persist();render();return}
    setTimeout(()=>scope(s=>{
      if(s==='all')Object.assign(e,nv);
      else if(s==='fut'){if(e.from>=k)Object.assign(e,nv);else{data.ev.push(Object.assign({},e,nv,{id:'e'+Date.now(),from:k,skip:[]}));e.to=addD(k,-1)}}
      else{e.skip.push(k);data.ev.push(Object.assign({},nv,{id:'e'+Date.now(),from:k,to:k,freq:{t:'d'},skip:[]}))}
      persist();render()}),0)},
   e?()=>setTimeout(()=>scope(s=>{if(s==='day')e.skip.push(k);else if(s==='fut'&&e.from<k)e.to=addD(k,-1);else data.ev.splice(data.ev.indexOf(e),1);persist();render()}),0):null);
}
function dayEd(sc,t){
  const k=key(cur), dk=`${k}|${sc}|${t}`, d=$('dlg'); let L=items(k,sc,t).map(i=>i.id);
  const draw=()=>{
    d.innerHTML=`<form method="dialog"><h2>Rutina de este día</h2><div class="fld">Reemplaza la rutina normal solo este día. Usa ↑ ↓ para ordenar y × para quitar.</div>`+L.map((id,i)=>`<div class="ck" style="justify-content:space-between"><span>${i+1}. ${esc((inv(id)||{}).name)}</span><span style="flex:none"><button type="button" class="ed" data-m="u" data-i="${i}">↑</button><button type="button" class="ed" data-m="d" data-i="${i}">↓</button><button type="button" class="ed" data-m="x" data-i="${i}">×</button></span></div>`).join('')
     +`<div class="fld" style="margin-top:10px"><input id="xq" class="sq" type="search" placeholder="🔍 Buscar producto para agregar…"></div><div id="xr"></div><div class="row"><button value="x" class="btn">Cancelar</button>${data.day[dk]?'<button value="r" class="btn">Restablecer</button>':''}<button value="ok" class="btn pri">Guardar</button></div></form>`;
    d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,m=b.dataset.m;if(m==='x')L.splice(i,1);else{const j=m==='u'?i-1:i+1;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]]}draw()});
    const xq=d.querySelector('#xq'),xr=d.querySelector('#xr');
    xq.oninput=()=>{const q=norm(xq.value.trim());if(!q){xr.innerHTML='';return}
      xr.innerHTML=data.inv.filter(x=>x.cat===CAT[sc]&&x.status!=='Terminado'&&norm(x.name).includes(q)).slice(0,6).map(x=>`<div class="ck" data-id="${x.id}">＋ ${esc(x.name)}</div>`).join('');
      xr.querySelectorAll('.ck').forEach(r=>r.onclick=()=>{L.push(r.dataset.id);draw()})};
    d.querySelector('form').onsubmit=e=>{const v=e.submitter.value;if(v==='ok')data.day[dk]=L;else if(v==='r')delete data.day[dk];else return;persist();render()};
  };
  draw();d.showModal();
}
function askRep(p){
  const T=key(new Date()), act=data.ev.filter(e=>e.inv===p.id&&(!e.to||e.to>=T)); if(!act.length)return;
  const opts=data.inv.filter(x=>x.cat===p.cat&&x.status!=='Terminado'&&x.id!==p.id).map(x=>x.name);
  setTimeout(()=>form('¿Con qué reemplazas '+p.name+'?',[{k:'sel',l:'Producto nuevo en tu rutina',t:'select',o:['(ninguno)',...opts]}],{},o=>{
    const n=data.inv.find(x=>x.name===o.sel);
    act.forEach(e=>{if(!n){if(e.from>=T)data.ev.splice(data.ev.indexOf(e),1);else e.to=addD(T,-1);return}
      if(e.from>=T)e.inv=n.id;else{data.ev.push(Object.assign({},e,{id:'e'+Date.now()+e.id,inv:n.id,from:T,skip:[]}));e.to=addD(T,-1)}});
    if(n){n.status='En uso';n.opened=n.opened||T}persist();render()}),0)}
function pmenu(k,ed){
  const d=$('dlg'), b=(v,l)=>`<button type="button" class="btn wide" data-v="${v}">${l}</button>`;
  d.innerHTML=`<h2>${esc((inv(k.slice(2))||{}).name||'Producto')}</h2>`+b('p',photos[k]?'📷 Cambiar foto':'📷 Agregar foto')+(ed?b('e',ed.startsWith('eedit')?'✎ Editar en la rutina':'✎ Editar producto'):'')+(photos[k]?b('x','Quitar foto'):'')+b('','Cancelar');
  d.querySelectorAll('button').forEach(x=>x.onclick=()=>{d.close();const v=x.dataset.v;
    if(v==='p'){pickFor=k;$('file').click()}
    else if(v==='x'){delete photos[k];savePhotos();render()}
    else if(v==='e'){const[t,a,c]=ed.split('|');if(t==='eedit'){const e=data.ev.find(z=>z.id===a);if(e)editEv(e);else dayEd(sec,c)}else if(t==='iedit')editInv(inv(a))}});
  d.showModal()}
function share(){
  const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data,photos,done},null,1)],{type:'application/json'});
  const f=new File([blob],`skincare-respaldo-${key(new Date())}.json`,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f]}).catch(()=>{});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click()}
}
$('imp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);
  if(!j.data||!confirm('Esto reemplaza tus datos actuales. ¿Continuar?'))return;
  data=j.data;fix();photos=j.photos||{};done=j.done||{};persist();savePhotos();save();render()}catch(err){alert('Archivo no válido')}})};
$('secs').onclick=e=>{const b=e.target.closest('button');if(b){sec=b.dataset.s;sub='r';render()}};
$('subs').onclick=e=>{const b=e.target.closest('button');if(b){sub=b.dataset.u;render()}};
$('list').addEventListener('input',e=>{if(e.target.id==='iq'){invQ=e.target.value;applyQ()}});
$('list').addEventListener('click',ev=>{
  const pb=ev.target.closest('.ph[data-k]');
  if(pb){if(ev.target.classList.contains('add'))pmenu(pb.dataset.k,pb.dataset.ed);return}
  const a=ev.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, p=a.dataset.id&&((sec==='inv'||sub==='i')?data.inv:coll()).find(x=>x.id===a.dataset.id);
  if(act==='tog'){const id=`${key(cur)}|${sec}|${p.id}`; done[id]=!done[id]; if(!done[id])delete done[id]; save(); render()}
  else if(act==='edit') edit(p); else if(act==='add') edit(null);
  else if(act==='start'){
    if(p.status==='Terminado'){(p.hist=p.hist||[]).push({o:p.opened,f:p.finished,u:uses(p.id),stars:p.stars,rebuy:p.rebuy,comment:p.comment});
      alert(`Tu reseña del envase anterior de ${p.name}:\n${[p.stars,p.rebuy&&p.rebuy!=='—'?'¿Recomprar? '+p.rebuy:'',p.comment].filter(Boolean).join(' · ')||'(sin reseña)'}`);p.stars=p.rebuy=p.comment='';p.reg='Completo'}
    p.status='En uso';p.opened=key(new Date());p.finished='';persist();render()}
  else if(act==='fin'){form('¿Cómo te fue con '+p.name+'?',[{k:'stars',l:'Calificación',t:'select',o:STARS},{k:'rebuy',l:'¿Lo volverías a comprar?',t:'select',o:REB},{k:'comment',l:'Comentarios',t:'text'}],{stars:'—',rebuy:'—'},o=>{Object.assign(p,o,{status:'Terminado',finished:key(new Date())});persist();askRep(p);render()})}
  else if(act==='cdone'){const x=a.dataset.x;if(x.slice(0,10)>key(new Date()))return;done[x]=!done[x];if(!done[x])delete done[x];save();render()}
  else if(act==='filt'){invF=a.dataset.c;render()}
  else if(act==='mktog'){const L=mkDay(key(cur));L.off=L.off.includes(p.id)?L.off.filter(x=>x!==p.id):[...L.off,p.id];persist();render()}
  else if(act==='mkx'){const n=prompt('¿Qué extra usaste? (ej. labial rojo)');if(n&&n.trim()){mkDay(key(cur)).extra.push(ensure(n.trim(),'Maquillaje'));persist();render()}}
  else if(act==='mkxdel'){mkDay(key(cur)).extra.splice(+a.dataset.i,1);persist();render()}
  else if(act==='mkno'){const L=mkDay(key(cur));L.off=data.mk.base.every(b=>L.off.includes(b.id))?[]:data.mk.base.map(b=>b.id);persist();render()}
  else if(act==='day'){cur=pd(a.dataset.d);render()}
  else if(act==='cal'){cur=new Date(cur.getFullYear(),cur.getMonth()+ +a.dataset.n,1,12);render()}
  else if(act==='ftog'){const id=`${key(cur)}|${tab}|${a.dataset.i}`;done[id]=!done[id];if(!done[id])delete done[id];save();render()}
  else if(act==='fedit'){const k=a.dataset.k,c0=faceId(k),opts=data.inv.filter(x=>x.status!=='Terminado'||x.id===c0);
    form('Paso: '+P[k].n,[{k:'sel',l:'Producto del inventario para este paso',t:'select',o:opts.map(x=>x.name)}],{sel:inv(c0).name},o=>{const n=opts.find(x=>x.name===o.sel);if(n){swap(k,n);persist();render()}})}
  else if(act==='use') editEv(null,{sc:SEC[p.cat],inv:p.id,t:'am'});
  else if(act==='nm') alert(a.dataset.n);
  else if(act==='eadd') editEv(null,{sc:sec,t:a.dataset.t||tab});
  else if(act==='eedit'){const e=data.ev.find(x=>x.id===a.dataset.ev);if(e)editEv(e);else dayEd(sec,a.dataset.t)}
  else if(act==='dayed') dayEd(sec,a.dataset.t||(sec==='face'?tab:'x'));
  else if(act==='listo'){const k=key(cur),t=sec==='face'?tab:'x';
    if(sec==='mk'){const L0=mkDay(k),L=items(k,'mk','x').map(i=>({id:i.id,on:!L0.off.includes(i.id)}));listo(L,L0.extra,'Maquillaje',(L2,ex)=>{L0.off=L2.filter(l=>!l.on).map(l=>l.id);L0.extra=ex;persist();render()})}
    else{const tt=sec==='face'?tab:sec,rk=`${k}|${tt}`,L=items(k,sec,t).map(i=>{const x=`${k}|${tt}|${i.id}`;return{id:i.id,x,on:data.reg[rk]?!!done[x]:true}});
      listo(L,data.add[rk]||[],CAT[sec],(L2,ex)=>{L2.forEach(l=>{if(l.on)done[l.x]=true;else delete done[l.x]});data.add[rk]=ex;data.reg[rk]=1;persist();save();render()})}}
  else if(act==='exp') share(); else if(act==='imp') $('imp').click();
});
let pickFor=null;
$('file').onchange=e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f||!pickFor) return;
  const k=pickFor, img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{
    const S=240, c=document.createElement('canvas'); c.width=c.height=S;
    const m=Math.min(img.width,img.height), sx=(img.width-m)/2, sy=(img.height-m)/2;
    c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,S,S);
    photos[k]=c.toDataURL('image/jpeg',.82); savePhotos(); URL.revokeObjectURL(url); render();
  };
  img.src=url;
};
const shift=n=>{cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+n,12);render()};
$('prev').onclick=()=>shift(-1); $('next').onclick=()=>shift(1);
$('today').onclick=()=>{cur=noon(new Date());render()};
$('tAm').onclick=()=>{tab='am';render()}; $('tPm').onclick=()=>{tab='pm';render()};
$('date').onchange=e=>{ if(e.target.value){const [y,m,d]=e.target.value.split('-').map(Number);cur=new Date(y,m-1,d,12);render()} };
render();
